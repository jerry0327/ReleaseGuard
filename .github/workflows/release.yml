name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify release state
        run: |
          python scripts/release_check.py --tag "$RELEASE_TAG"
          python -m unittest discover -s tests -v
          python -m compileall -q releaseguard tests scripts
      - name: Build artifacts
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          python -m pip wheel . --no-deps --wheel-dir dist
          git archive \
            --format=zip \
            --prefix="ReleaseGuard-${version}/" \
            --output="dist/ReleaseGuard-${version}-source.zip" \
            "$RELEASE_TAG"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --generate-notes \
            --title "ReleaseGuard $RELEASE_TAG"
