name: Bug report
description: Report incorrect ReleaseGuard behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not disclose vulnerabilities here. Use SECURITY.md for security-sensitive reports."
  - type: input
    id: version
    attributes:
      label: ReleaseGuard version or commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What did ReleaseGuard report or fail to report?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include non-sensitive policy, file paths, or fixture details.
    validations:
      required: true
