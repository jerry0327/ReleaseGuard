[releaseguard]
# Findings at or above this severity fail the action.
fail_on = "critical"
max_changed_files = 200

changelog_paths = ["CHANGELOG.md"]
manifest_paths = ["package.json", "pyproject.toml", "Cargo.toml"]
lockfile_paths = [
  "package-lock.json",
  "npm-shrinkwrap.json",
  "pnpm-lock.yaml",
  "yarn.lock",
  "uv.lock",
  "poetry.lock",
  "Cargo.lock",
]

protected_patterns = [
  ".github/workflows/**",
  ".github/CODEOWNERS",
  "CODEOWNERS",
  ".npmrc",
  "action.yml",
  "scripts/release/**",
]

allowed_binary_patterns = ["docs/**", "assets/**"]

[releaseguard.review]
# Set to 1 or more to require fresh, independent approval when a finding reaches
# required_on. Zero keeps review evidence disabled for initial adoption.
minimum_independent_approvals = 0
required_on = "high"
allow_stale_approvals = false
exclude_bots = true
fail_closed = true
allowed_author_associations = ["OWNER", "MEMBER", "COLLABORATOR"]
trusted_reviewers = []
