[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "releaseguard"
version = "0.4.0"
description = "Deterministic release security, review authorization, and package provenance gates"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ReleaseGuard contributors"}]
keywords = [
  "supply-chain",
  "security",
  "github-actions",
  "release",
  "provenance",
  "sigstore",
  "slsa",
  "sarif",
  "python",
  "cargo",
  "oss",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
releaseguard = "releaseguard.cli:main"

[tool.setuptools.packages.find]
include = ["releaseguard*"]
